object: instrument
alias: INST
name: XSHOOTER_spectrographs
effects:
  - name: arm_routing
    class: DichroicTree
    kwargs:
      tree_filename: throughput/branches.dat
      dichroic_names: []
      filename_format: '{}'
  - name: slits
    class: SelectorWheel
    kwargs:
      selector_key: aperture_id
      wheel:
        - selector_value: [0]
          effect_class: SlitWheel
          effect_kwargs:
            slit_names: ['0.5', '0.8', '1.0', '1.3', '1.6', '5.0']
            filename_format: 'slits/slit_{}.dat'
            current_slit: '!INST.uvb_curr_slit'
        - selector_value: [1]
          effect_class: SlitWheel
          effect_kwargs:
            slit_names: ['0.4', '0.7', '0.9', '1.2', '1.5', '5.0']
            filename_format: 'slits/slit_{}.dat'
            current_slit: '!INST.vis_curr_slit'
        - selector_value: [2]
          effect_class: SlitWheel
          effect_kwargs:
            slit_names: ['0.4', '0.6', '0.9', '1.2', '5.0', '0.6JH', '0.9JH']
            filename_format: 'slits/slit_{}.dat'
            current_slit: '!INST.nir_curr_slit'
  - name: order_throughput
    class: SpectralEfficiency
    kwargs:
      filename: throughput/orders.fits
  - name: nir_order_blocking
    class: SelectorWheel
    kwargs:
      selector_key: aperture_id
      allowed_missing_selector_values: [0, 1]
      wheel:
        - selector_value: [2]
          effect_class: FilterWheel
          effect_kwargs:
            filter_names: ['0.4', '0.6', '0.9', '1.2', '5.0', '0.6JH', '0.9JH']
            filename_format: 'throughput/filter_{}.dat'
            current_filter: '!INST.nir_curr_slit'
  - name: detector_qe
    class: SelectorWheel
    kwargs:
      selector_key: aperture_id
      wheel:
        - selector_value: [0]
          effect_class: SpectralQuantumEfficiency
          effect_kwargs: {filename: throughput/qe_uvb.dat}
        - selector_value: [1]
          effect_class: SpectralQuantumEfficiency
          effect_kwargs: {filename: throughput/qe_vis.dat}
        - selector_value: [2]
          effect_class: SpectralQuantumEfficiency
          effect_kwargs: {filename: throughput/qe_nir.dat}
  - name: atmospheric_dispersion
    description: UVB/VIS ADCs assumed ideal; NIR has no ADC
    class: SelectorWheel
    kwargs:
      selector_key: aperture_id
      z_order: [651]
      allowed_missing_selector_values: [0, 1]
      wheel:
        - selector_value: [2]
          effect_class: ADShift
          effect_kwargs:
            temperature: '!ATMO.temperature'
            pressure: '!ATMO.pressure'
            humidity: '!ATMO.humidity'
            wave_ref_um: 1.31
            method: map_coords
  - name: spectral_traces
    class: SpectralTraceList
    kwargs:
      filename: traces/traces.fits
      trace_flux_jacobian: true
  - name: nir_stray_light
    class: SelectorWheel
    kwargs:
      selector_key: image_plane_id
      allowed_missing_selector_values: [0, 1]
      wheel:
        - selector_value: [2]
          effect_class: ImagePlaneBackground
          effect_kwargs:
            include: true
            filename: detector/nir_background.fits
            extname: '!INST.nir_curr_slit'
