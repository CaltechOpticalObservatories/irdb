### set instrument mode
---
alias: ATMO
properties:
  relH: 10          # [5:95:5]
  spectrum:
    filename: MICADO_water_trans.fits

---
object: observation
alias : OBS
name : SCAO

properties :
    ins_mode: "SCAO"

---
object: simulation
alias: SIM
name: simulation_parameters

properties:
  psf:
    interp_psf: True
    interp_order: 1
