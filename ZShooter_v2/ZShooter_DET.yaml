  - name: exposure_integration_selector
    description: Summing up sky signal for all DITs and NDITs for different detectors
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0] # CCD_B
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_blue"
            ndit: "!OBS.ndit_blue"
        - selector_value: [1] # CCD_G
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_green"
            ndit: "!OBS.ndit_green"
        - selector_value: [2] # CCD_R
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_red"
            ndit: "!OBS.ndit_red"
        - selector_value: [ 3 ] # YJ detector
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_yj"
            ndit: "!OBS.ndit_yj"
        - selector_value: [ 4 ] # H detector
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_h"
            ndit: "!OBS.ndit_h"
        - selector_value: [ 5 ] #  K detector
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_k"
            ndit: "!OBS.ndit_k"

  - name: shot_noise
    description : apply poisson shot noise to images
    class: ShotNoise

  - name: dark_current_selector
    description: Selector Wheel for dark current levels for CCDs and APDs
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.00001    # [e-/s] level of dark current
            dit: "!OBS.dit_blue"
            ndit: "!OBS.ndit_blue"
        - selector_value: [1]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.00001    # [e-/s] level of dark current
            dit: "!OBS.dit_green"
            ndit: "!OBS.ndit_green"
        - selector_value: [2]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.00001     # [e-/s] level of dark current
            dit: "!OBS.dit_red"
            ndit: "!OBS.ndit_red"
        - selector_value: [3]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.00001    # [e-/s] level of dark current
            dit: "!OBS.dit_yj"
            ndit: "!OBS.ndit_yj"
        - selector_value: [4]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.00001    # [e-/s] level of dark current
            dit: "!OBS.dit_h"
            ndit: "!OBS.ndit_h"
        - selector_value: [5]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.00001     # [e-/s] level of dark current
            dit: "!OBS.dit_k"
            ndit: "!OBS.ndit_k"

  - name: detector_linearity_selector
    description: Selector Wheel for linearity characteristics for CCDs and APDs
    class: SelectorWheel
    include: False
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]   # CCD_B detectors
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 64e3]
              measured: [0, 64e3]
            ndit: "!OBS.ndit_blue"
        - selector_value: [1]   # CCD_G detector
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 64e3]
              measured: [0, 64e3]
            ndit: "!OBS.ndit_green"
        - selector_value: [2] # CCD_R detectors
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 64e3]
              measured: [0, 64e3]
            ndit: "!OBS.ndit_red"
        - selector_value: [3]   # APD detectors
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 64e3]
              measured: [0, 64e3]
            ndit: "!OBS.ndit_yj"
        - selector_value: [4]   # APD detectors
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 64e3]
              measured: [0, 64e3]
            ndit: "!OBS.ndit_h"
        - selector_value: [5 ]   # APD detectors
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [ 0, 64e3 ]
              measured: [ 0, 64e3 ]
            ndit: "!OBS.ndit_k"


