### ZShooter_v2 DETECTORs for ZSPEC
object : detector
alias : DET
name : zspec_detectors
description : 3 CCDs/qCCDs for b, g, r arms and 3 HgCdTe APDs for yj, h, k arms

properties :
    temperature : -120
    binx : 1
    biny: 1
    binx_blue: 1
    biny_blue: 1
    binx_green: 1
    biny_green: 1
    binx_red: 1
    biny_red: 1
    detector_mode: SPEC
    # Input-referred engineering operating points; F multiplies photon variance.
    pixel_size_b: 0.015
    usable_well_b: 60000
    ron_b: 0.1
    dark_b: 0.000166
    excess_noise_factor_b: 1.0
    avalanche_gain_b: 1
    detector_type_b: qCCD
    qe_class_b: TaperedQuantumEfficiency
    qe_kwargs_b:
      axis: y
      position_unit: pix
      position_min: 0
      position_max: 4096
      wave_unit: nm
      center_wave_min: '!INST.tapered_qe_b_center_wave_min'
      center_wave_max: '!INST.tapered_qe_b_center_wave_max'
      flat_width: '!INST.tapered_qe_b_flat_width'
      transition_width: '!INST.tapered_qe_b_transition_width'
      peak: '!INST.tapered_qe_peak'
      floor: '!INST.tapered_qe_floor'
      clip_position: True
      diffuse_position_samples: '!INST.tapered_qe_diffuse_position_samples'
    pixel_size_g: 0.015
    usable_well_g: 60000
    ron_g: 0.1
    dark_g: 0.000166
    excess_noise_factor_g: 1.0
    avalanche_gain_g: 1
    detector_type_g: qCCD
    qe_class_g: TaperedQuantumEfficiency
    qe_kwargs_g:
      axis: y
      position_unit: pix
      position_min: 0
      position_max: 4096
      wave_unit: nm
      center_wave_min: '!INST.tapered_qe_g_center_wave_min'
      center_wave_max: '!INST.tapered_qe_g_center_wave_max'
      flat_width: '!INST.tapered_qe_g_flat_width'
      transition_width: '!INST.tapered_qe_g_transition_width'
      peak: '!INST.tapered_qe_peak'
      floor: '!INST.tapered_qe_floor'
      clip_position: True
      diffuse_position_samples: '!INST.tapered_qe_diffuse_position_samples'
    pixel_size_r: 0.015
    usable_well_r: 60000
    ron_r: 0.1
    dark_r: 0.000166
    excess_noise_factor_r: 1.0
    avalanche_gain_r: 1
    detector_type_r: qCCD
    qe_class_r: TaperedQuantumEfficiency
    qe_kwargs_r:
      axis: y
      position_unit: pix
      position_min: 0
      position_max: 4096
      wave_unit: nm
      center_wave_min: '!INST.tapered_qe_r_center_wave_min'
      center_wave_max: '!INST.tapered_qe_r_center_wave_max'
      flat_width: '!INST.tapered_qe_r_flat_width'
      transition_width: '!INST.tapered_qe_r_transition_width'
      peak: '!INST.tapered_qe_peak'
      floor: '!INST.tapered_qe_floor'
      clip_position: True
      diffuse_position_samples: '!INST.tapered_qe_diffuse_position_samples'
    pixel_size_yj: 0.015
    usable_well_yj: 15000
    ron_yj: 0.5
    dark_yj: 0.0001
    excess_noise_factor_yj: 1.2
    avalanche_gain_yj: 10
    detector_type_yj: LmAPD
    qe_class_yj: SpectralQuantumEfficiency
    qe_kwargs_yj: {filename: detector_specs/H2RG_TER.dat}
    pixel_size_h: 0.015
    usable_well_h: 15000
    ron_h: 0.5
    dark_h: 0.0001
    excess_noise_factor_h: 1.2
    avalanche_gain_h: 10
    detector_type_h: LmAPD
    qe_class_h: SpectralQuantumEfficiency
    qe_kwargs_h: {filename: detector_specs/H2RG_TER.dat}
    pixel_size_k: 0.015
    usable_well_k: 15000
    ron_k: 0.5
    dark_k: 0.0001
    excess_noise_factor_k: 1.2
    avalanche_gain_k: 10
    detector_type_k: LmAPD
    qe_class_k: SpectralQuantumEfficiency
    qe_kwargs_k: {filename: detector_specs/H2RG_TER.dat}
    # Per-image-plane scales. These currently match the global ZShooter
    # values in ZShooter.yaml, but live here so each camera can diverge when
    # the final channel optics are available.
    pixel_scale_b: 0.1570545
    pixel_scale_g: 0.1570545
    pixel_scale_r: 0.1570545
    pixel_scale_yj: 0.1570545
    pixel_scale_h: 0.1570545
    pixel_scale_k: 0.1570545
    plate_scale_b: 10.4703
    plate_scale_g: 10.4703
    plate_scale_r: 10.4703
    plate_scale_yj: 10.4703
    plate_scale_h: 10.4703
    plate_scale_k: 10.4703
    x_size_k: 2048
    y_size_k: 2048
