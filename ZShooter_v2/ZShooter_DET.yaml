### ZShooter_v2 DETECTORs for ZSPEC
object : detector
alias : DET
name : zspec_detectors
description : 3 CCDs/qCCDs for b, g, r arms and 3 HgCdTe APDs for yj, h, k arms

properties :
    temperature : -120
    binx : 1
    biny: 1
    full_well: 64000
    # Per-image-plane scales. These currently match the global ZShooter
    # values in ZShooter.yaml, but live here so each camera can diverge when
    # the final channel optics are available.
    pixel_scale_b: 0.15556
    pixel_scale_g: 0.15556
    pixel_scale_r: 0.15556
    pixel_scale_yj: 0.15556
    pixel_scale_h: 0.15556
    pixel_scale_k: 0.15556
    plate_scale_b: 10.37067
    plate_scale_g: 10.37067
    plate_scale_r: 10.37067
    plate_scale_yj: 10.37067
    plate_scale_h: 10.37067
    plate_scale_k: 10.37067
    tapered_qe_example:
      enabled: False
      description: >
        Detector-axis tapered QE design metadata. This is documentation for
        the disabled TaperedQuantumEfficiency selector in ZShooter_SPEC.yaml,
        not an active detector effect.
      axis: y
      position_unit: pix
      position_min: 0
      position_max: 2048
      wave_unit: nm
      peak: 0.95
      description_note: >
        This is a flattop/wide-rolloff coating model, not a Gaussian bandpass.
        Use flat_width_nm for the plateau width and transition_width_nm for
        each cosine-edged shoulder.
      channels:
        - name: b
          detector_id: 0
          image_plane_id: 0
          blue_nm: 310
          red_nm: 420
          flat_width_nm: 100
          transition_width_nm: 300
        - name: g
          detector_id: 1
          image_plane_id: 1
          blue_nm: 400
          red_nm: 600
          flat_width_nm: 100
          transition_width_nm: 300
        - name: r
          detector_id: 2
          image_plane_id: 2
          blue_nm: 580
          red_nm: 980
          flat_width_nm: 240
          transition_width_nm: 500

effects :
  - name: detector_b
    description: Single 2k x 2k detector for ZShooter_v2 B arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 0
        pixel_scale: "!DET.pixel_scale_b"
        plate_scale: "!DET.plate_scale_b"
        array_dict:
          id: [0]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CCD_B"

