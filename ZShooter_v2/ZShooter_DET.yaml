  - name: detector_y
    description: Single 2k x 2k detector for ZShooter_v1 K arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 6
        array_dict:
          id: [6]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
