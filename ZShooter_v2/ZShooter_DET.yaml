### ZShooter_v1 DETECTORs for ZSPEC
object : detector
alias : DET
name : zspec_detectors
description : 3 CCDs/qCCDs for ub, gr, iz arms and 4 HgCdTe? detectors for NIR arms

properties :
    temperature : -120
    binx : 1
    biny: 1
    dit : "!OBS.dit"
    ndit : "!OBS.ndit"

effects :
  - name: detector_ub
    description: Single 4k x 4k detector for ZShooter_v1 UB arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 0
        array_dict:
          id: [0]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [4096]
          y_size: [4096]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CCD_UB"

  - name: detector_gr
    description: Single 4k x 4k detector for ZShooter_v1 GR arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 1
        array_dict:
          id: [1]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [4096]
          y_size: [4096]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CCD_GR"

  - name: detector_iz
    description: Single 4k x 4k detector for ZShooter_v1 IZ arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 2
        array_dict:
          id: [2]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [4096]
          y_size: [4096]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CCD_IZ"

  - name: detector_y
    description: Single 2k x 2k detector for ZShooter_v1 Y arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 3
        array_dict:
          id: [3]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "APD_Y"

  - name: detector_y
    description: Single 2k x 2k detector for ZShooter_v1 J arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 4
        array_dict:
          id: [4]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "APD_J"

  - name: detector_y
    description: Single 2k x 2k detector for ZShooter_v1 H arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 5
        array_dict:
          id: [5]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
