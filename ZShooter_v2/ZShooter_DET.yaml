  - name: readout_noise_selector
    description: Selector Wheel for readout noise levels for CCDs and APDs
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 0.1    # CCD readout noise std dev in electrons
            ndit: "!OBS.ndit_blue"
        - selector_value: [1]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 0.1    # CCD readout noise std dev in electrons
            ndit: "!OBS.ndit_green"
        - selector_value: [2]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 0.1    # CCD readout noise std dev in electrons
            ndit: "!OBS.ndit_red"
        - selector_value: [3]   # APD detectors
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: .5    # APD readout noise std dev in electrons
            ndit: "!OBS.ndit_yj"
        - selector_value: [ 4 ]   # APD detectors
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: .5     # APD readout noise std dev in electrons
            ndit: "!OBS.ndit_h"
        - selector_value: [ 5 ]   # APD detectors
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: .5     # APD readout noise std dev in electrons
            ndit: "!OBS.ndit_k"

  - name: visible_binning_selector
    description: Applies Binning in Visible
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      allowed_missing_selector_values: [ 3, 4, 5 ]
      wheel:
        - selector_value: [ 0 ]
          effect_class: UnequalBinnedImage
          effect_kwargs:
              binx: "!DET.binx"
              biny: "!DET.biny"
        - selector_value: [ 1 ]
          effect_class: UnequalBinnedImage
          effect_kwargs:
              binx: "!DET.binx"
              biny: "!DET.biny"
        - selector_value: [ 2 ]
          effect_class: UnequalBinnedImage
          effect_kwargs:
              binx: "!DET.binx"
              biny: "!DET.biny"

  - name: bias_selector
    description: Selector Wheel for bias levels for CCDs and APDs
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0,1,2]   # CCD detectors
          effect_class: Bias
          effect_kwargs:
            bias: 1040    # CCD bias level in electrons
        - selector_value: [3,4,5]   # APD detectors
          effect_class: Bias
          effect_kwargs:
            bias: 1040     # APD bias level in electrons
