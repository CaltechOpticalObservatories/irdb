effects :
  - name: detector_b
    description: Single 2k x 2k detector for ZShooter_v2 B arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 0
        pixel_scale: "!DET.pixel_scale_b"
        plate_scale: "!DET.plate_scale_b"
        array_dict:
          id: [0]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [4096]
          pixel_size: ['!DET.pixel_size_b']
          angle: [0.0]
          gain: [1.0]
          detmode: ['!DET.detector_mode']
          dettype: ['!DET.detector_type_b']
          exnoise: ['!DET.excess_noise_factor_b']
          avgain: ['!DET.avalanche_gain_b']
          welldep: ['!DET.usable_well_b']
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "!DET.detector_type_b"

  - name: detector_g
    description: Single 2k x 2k detector for ZShooter_v2 G arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 1
        pixel_scale: "!DET.pixel_scale_g"
        plate_scale: "!DET.plate_scale_g"
        array_dict:
          id: [1]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [4096]
          pixel_size: ['!DET.pixel_size_g']
          angle: [0.0]
          gain: [1.0]
          detmode: ['!DET.detector_mode']
          dettype: ['!DET.detector_type_g']
          exnoise: ['!DET.excess_noise_factor_g']
          avgain: ['!DET.avalanche_gain_g']
          welldep: ['!DET.usable_well_g']
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "!DET.detector_type_g"

  - name: detector_r
    description: Single 2k x 2k detector for ZShooter_v2 R arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 2
        pixel_scale: "!DET.pixel_scale_r"
        plate_scale: "!DET.plate_scale_r"
        array_dict:
          id: [2]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [4096]
          pixel_size: ['!DET.pixel_size_r']
          angle: [0.0]
          gain: [1.0]
          detmode: ['!DET.detector_mode']
          dettype: ['!DET.detector_type_r']
          exnoise: ['!DET.excess_noise_factor_r']
          avgain: ['!DET.avalanche_gain_r']
          welldep: ['!DET.usable_well_r']
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "!DET.detector_type_r"

  - name: detector_yj
    description: Single 2k x 2k detector for ZShooter_v2 YJ arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 3
        pixel_scale: "!DET.pixel_scale_yj"
        plate_scale: "!DET.plate_scale_yj"
        array_dict:
          id: [3]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: ['!DET.pixel_size_yj']
          angle: [0.0]
          gain: [1.0]
          detmode: ['!DET.detector_mode']
          dettype: ['!DET.detector_type_yj']
          exnoise: ['!DET.excess_noise_factor_yj']
          avgain: ['!DET.avalanche_gain_yj']
          welldep: ['!DET.usable_well_yj']
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "!DET.detector_type_yj"

  - name: detector_h
    description: Single 2k x 2k detector for ZShooter_v2 H arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 4
        pixel_scale: "!DET.pixel_scale_h"
        plate_scale: "!DET.plate_scale_h"
        array_dict:
          id: [4]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: ['!DET.pixel_size_h']
          angle: [0.0]
          gain: [1.0]
          detmode: ['!DET.detector_mode']
          dettype: ['!DET.detector_type_h']
          exnoise: ['!DET.excess_noise_factor_h']
          avgain: ['!DET.avalanche_gain_h']
          welldep: ['!DET.usable_well_h']
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "!DET.detector_type_h"

  - name: detector_k
    description: Single detector for ZShooter_v2 K arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 5
        pixel_scale: "!DET.pixel_scale_k"
        plate_scale: "!DET.plate_scale_k"
        array_dict:
          id: [5]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: ["!DET.x_size_k"]
          y_size: ["!DET.y_size_k"]
          pixel_size: ['!DET.pixel_size_k']
          angle: [0.0]
          gain: [1.0]
          detmode: ['!DET.detector_mode']
          dettype: ['!DET.detector_type_k']
          exnoise: ['!DET.excess_noise_factor_k']
          avgain: ['!DET.avalanche_gain_k']
          welldep: ['!DET.usable_well_k']
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "!DET.detector_type_k"

  - name: exposure_integration_selector
    description: Summing up sky signal for all DITs and NDITs for different detectors
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0] # CCD_B
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_blue"
            ndit: "!OBS.ndit_blue"
        - selector_value: [1] # CCD_G
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_green"
            ndit: "!OBS.ndit_green"
        - selector_value: [2] # CCD_R
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_red"
            ndit: "!OBS.ndit_red"
        - selector_value: [ 3 ] # YJ detector
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_yj"
            ndit: "!OBS.ndit_yj"
        - selector_value: [ 4 ] # H detector
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_h"
            ndit: "!OBS.ndit_h"
        - selector_value: [ 5 ] #  K detector
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_k"
            ndit: "!OBS.ndit_k"

  - name: dark_current_selector
    description: Selector Wheel for dark current levels for CCDs and APDs
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]
          effect_class: DarkCurrent
          effect_kwargs:
            value: "!DET.dark_b"
            dit: "!OBS.dit_blue"
            ndit: "!OBS.ndit_blue"
        - selector_value: [1]
          effect_class: DarkCurrent
          effect_kwargs:
            value: "!DET.dark_g"
            dit: "!OBS.dit_green"
            ndit: "!OBS.ndit_green"
        - selector_value: [2]
          effect_class: DarkCurrent
          effect_kwargs:
            value: "!DET.dark_r"
            dit: "!OBS.dit_red"
            ndit: "!OBS.ndit_red"
        - selector_value: [3]
          effect_class: DarkCurrent
          effect_kwargs:
            value: "!DET.dark_yj"
            dit: "!OBS.dit_yj"
            ndit: "!OBS.ndit_yj"
        - selector_value: [4]
          effect_class: DarkCurrent
          effect_kwargs:
            value: "!DET.dark_h"
            dit: "!OBS.dit_h"
            ndit: "!OBS.ndit_h"
        - selector_value: [5]
          effect_class: DarkCurrent
          effect_kwargs:
            value: "!DET.dark_k"
            dit: "!OBS.dit_k"
            ndit: "!OBS.ndit_k"

  - name: ccd_charge_binning
    description: On-chip charge summation for the three visible CCD design channels
    class: SelectorWheel
    kwargs:
      selector_key: detector_id
      z_order: [815]
      allowed_missing_selector_values: [3, 4, 5]
      wheel:
        - selector_value: [0]
          effect_class: OnChipBinning
          effect_kwargs: {binx: '!DET.binx_blue', biny: '!DET.biny_blue'}
        - selector_value: [1]
          effect_class: OnChipBinning
          effect_kwargs: {binx: '!DET.binx_green', biny: '!DET.biny_green'}
        - selector_value: [2]
          effect_class: OnChipBinning
          effect_kwargs: {binx: '!DET.binx_red', biny: '!DET.biny_red'}

  - name: exposure_limit
    description: Warn about per-integration charge; never change DIT/NDIT or clip data
    class: SelectorWheel
    kwargs:
      selector_key: detector_id
      wheel:
        - selector_value: [0]
          effect_class: ExposureLimit
          effect_kwargs: {usable_well: '!DET.usable_well_b', ndit: '!OBS.ndit_blue'}
        - selector_value: [1]
          effect_class: ExposureLimit
          effect_kwargs: {usable_well: '!DET.usable_well_g', ndit: '!OBS.ndit_green'}
        - selector_value: [2]
          effect_class: ExposureLimit
          effect_kwargs: {usable_well: '!DET.usable_well_r', ndit: '!OBS.ndit_red'}
        - selector_value: [3]
          effect_class: ExposureLimit
          effect_kwargs: {usable_well: '!DET.usable_well_yj', ndit: '!OBS.ndit_yj'}
        - selector_value: [4]
          effect_class: ExposureLimit
          effect_kwargs: {usable_well: '!DET.usable_well_h', ndit: '!OBS.ndit_h'}
        - selector_value: [5]
          effect_class: ExposureLimit
          effect_kwargs: {usable_well: '!DET.usable_well_k', ndit: '!OBS.ndit_k'}

  - name: shot_noise
    description: Photon and dark statistics, with LmAPD excess photon variance
    class: SelectorWheel
    kwargs:
      selector_key: detector_id
      wheel:
        - selector_value: [0, 1, 2]
          effect_class: ShotNoise
        - selector_value: [3]
          effect_class: AvalancheShotNoise
          effect_kwargs: {excess_noise_factor: '!DET.excess_noise_factor_yj', dark_current: '!DET.dark_yj', dit: '!OBS.dit_yj', ndit: '!OBS.ndit_yj'}
        - selector_value: [4]
          effect_class: AvalancheShotNoise
          effect_kwargs: {excess_noise_factor: '!DET.excess_noise_factor_h', dark_current: '!DET.dark_h', dit: '!OBS.dit_h', ndit: '!OBS.ndit_h'}
        - selector_value: [5]
          effect_class: AvalancheShotNoise
          effect_kwargs: {excess_noise_factor: '!DET.excess_noise_factor_k', dark_current: '!DET.dark_k', dit: '!OBS.dit_k', ndit: '!OBS.ndit_k'}

#  - name: border_reference_pixels
#    description: Blanks the signal on N edge row and column pixels
#    class: ReferencePixelBorder
#    kwargs:
#        left:  50
#        right: 50 #New CCD only has prescan, no overscan

  - name: readout_noise_selector
    description: Selector Wheel for readout noise levels for CCDs and APDs
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: "!DET.ron_b"
            ndit: "!OBS.ndit_blue"
        - selector_value: [1]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: "!DET.ron_g"
            ndit: "!OBS.ndit_green"
        - selector_value: [2]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: "!DET.ron_r"
            ndit: "!OBS.ndit_red"
        - selector_value: [3]   # APD detectors
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: "!DET.ron_yj"
            ndit: "!OBS.ndit_yj"
        - selector_value: [ 4 ]   # APD detectors
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: "!DET.ron_h"
            ndit: "!OBS.ndit_h"
        - selector_value: [ 5 ]   # APD detectors
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: "!DET.ron_k"
            ndit: "!OBS.ndit_k"

  - name: visible_binning_selector
    description: Software summation of visible pixels after read noise; separate from CCD charge binning
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      allowed_missing_selector_values: [ 3, 4, 5 ]
      wheel:
        - selector_value: [ 0 ]
          effect_class: UnequalBinnedImage
          effect_kwargs:
              binx: "!DET.binx"
              biny: "!DET.biny"
        - selector_value: [ 1 ]
          effect_class: UnequalBinnedImage
          effect_kwargs:
              binx: "!DET.binx"
              biny: "!DET.biny"
        - selector_value: [ 2 ]
          effect_class: UnequalBinnedImage
          effect_kwargs:
              binx: "!DET.binx"
              biny: "!DET.biny"

  - name: bias_selector
    description: Selector Wheel for bias levels for CCDs and APDs
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0,1,2]   # CCD detectors
          effect_class: Bias
          effect_kwargs:
            bias: 1040    # CCD bias level in electrons
        - selector_value: [3,4,5]   # APD detectors
          effect_class: Bias
          effect_kwargs:
            bias: 0     # APD bias level in electrons
