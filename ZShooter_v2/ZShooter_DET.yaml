### ZShooter_v2 DETECTORs for ZSPEC
object : detector
alias : DET
name : zspec_detectors
description : 3 CCDs/qCCDs for b, g, r arms and 3 HgCdTe APDs for yj, h, k arms

properties :
    temperature : -120
    binx : 1
    biny: 1

effects :
  - name: detector_b
    description: Single 2k x 2k detector for ZShooter_v2 B arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 0
        array_dict:
          id: [0]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CCD_B"

  - name: detector_g
    description: Single 2k x 2k detector for ZShooter_v2 G arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 1
        array_dict:
          id: [1]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CCD_G"

  - name: detector_r
    description: Single 2k x 2k detector for ZShooter_v2 R arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 2
        array_dict:
          id: [2]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CCD_R"

  - name: detector_yj
    description: Single 2k x 2k detector for ZShooter_v2 YJ arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 3
        array_dict:
          id: [3]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "APD_YJ"

  - name: detector_h
    description: Single 2k x 2k detector for ZShooter_v2 H arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 4
        array_dict:
          id: [4]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "APD_H"

  - name: detector_k
    description: Single 2k x 2k detector for ZShooter_v2 K arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 5
        array_dict:
          id: [5]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [2048]
          y_size: [2048]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "APD_K"

  - name: exposure_integration_selector
    description: Summing up sky signal for all DITs and NDITs for different detectors
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0] # CCD_B
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_blue"
            ndit: "!OBS.ndit_blue"
        - selector_value: [1] # CCD_G
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_green"
            ndit: "!OBS.ndit_green"
        - selector_value: [2,3,4,5] # CCD_R, APD_YJ, APD_H, and APD_K detectors
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.dit_red"
            ndit: "!OBS.ndit_red"

  - name: shot_noise
    description : apply poisson shot noise to images
    class: ShotNoise

  - name: dark_current_selector
    description: Selector Wheel for dark current levels for CCDs and APDs
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.00001    # [e-/s] level of dark current for CCD detectors
            dit: "!OBS.dit_blue"
            ndit: "!OBS.ndit_blue"
        - selector_value: [1]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.00001    # [e-/s] level of dark current for CCD detectors
            dit: "!OBS.dit_green"
            ndit: "!OBS.ndit_green"
        - selector_value: [2,3,4,5]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.00001     # [e-/s] level of dark current for APD detectors
            dit: "!OBS.dit_red"
            ndit: "!OBS.ndit_red"

  - name: detector_linearity_selector
    description: Selector Wheel for linearity characteristics for CCDs and APDs
    class: SelectorWheel
    include: False
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]   # CCD_B detectors
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 64e3]
              measured: [0, 64e3]
            ndit: "!OBS.ndit_blue"
        - selector_value: [1]   # CCD_G detector
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 64e3]
              measured: [0, 64e3]
            ndit: "!OBS.ndit_green"
        - selector_value: [2] # CCD_R detectors
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 64e3]
              measured: [0, 64e3]
            ndit: "!OBS.ndit_red"
        - selector_value: [3,4,5]   # APD detectors
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 64e3]
              measured: [0, 64e3]
            ndit: "!OBS.ndit_red"

#  - name: border_reference_pixels
#    description: Blanks the signal on N edge row and column pixels
#    class: ReferencePixelBorder
#    kwargs:
#        left:  50
#        right: 50 #New CCD only has prescan, no overscan

  - name: readout_noise_selector
    description: Selector Wheel for readout noise levels for CCDs and APDs
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 2    # CCD readout noise std dev in electrons
            ndit: "!OBS.ndit_blue"
        - selector_value: [1]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 2    # CCD readout noise std dev in electrons
            ndit: "!OBS.ndit_green"
        - selector_value: [2]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 2    # CCD readout noise std dev in electrons
            ndit: "!OBS.ndit_red"
        - selector_value: [3,4,5]   # APD detectors
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 2     # APD readout noise std dev in electrons
            ndit: "!OBS.ndit_red"

  - name: binning
    description: Applies binning
    class: UnequalBinnedImage
    include: False
    kwargs:
        binx: "!DET.binx"
        biny: "!DET.biny"

  - name: bias_selector
    description: Selector Wheel for bias levels for CCDs and APDs
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0,1,2]   # CCD detectors
          effect_class: Bias
          effect_kwargs:
            bias: 1040    # CCD bias level in electrons
        - selector_value: [3,4,5]   # APD detectors
          effect_class: Bias
          effect_kwargs:
            bias: 1040     # APD bias level in electrons
