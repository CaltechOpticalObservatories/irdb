 - name: slitwheel_selector
   description: SelectorWheel holding two SlitWheels, one for ub+vis, one for nir
   class: SelectorWheel
   include: True
   kwargs:
     selector_key: "aperture_id"
     wheel:
       - selector_value: 0
         effect_class: SlitWheel
         effect_kwargs:
           slit_names:
             - "half_arcsec"
             - "one_arcsec"
             - "two_arcsec"
           filename_format: "slits/ubvis_{}.dat"
           current_slit: "one_arcsec"

       - selector_value: 3
         effect_class: SlitWheel
         effect_kwargs:
           slit_names:
             - "half_arcsec"
             - "one_arcsec"
             - "two_arcsec"
           filename_format: "slits/nir_{}.dat"
           current_slit: "one_arcsec"


