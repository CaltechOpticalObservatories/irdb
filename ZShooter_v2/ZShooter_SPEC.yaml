
object: instrument
alias: INST
name: ZShooter
description: Effects from the ZShooter optics

properties:
  decouple_detector_from_sky_headers: True  # needed for slit spectroscopy


effects:
 - name: first_dichroic
   description: Splits into ub+vis and nir arms
   class: Dichroic
   include: True
   kwargs:
     filename: "dichroics/TER_first_dichroic.dat"
     arm_key: "aperture_id"
     arm_actions:
       0: "reflection"  # ub+vis arm, later splits into 3 sub-arms (ub, gr, iz)
       3: "transmission"   # NIR arm, later splits into 4 sub-arms (y, j, h, k)


