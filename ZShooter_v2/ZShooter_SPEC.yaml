 - name: second_dichroic_set_selector
   description: SelectorWheel holding two Dichroics, one for ubvis arm that splits into ub and vis, one for nir that splits into yj and hk
   class: SelectorWheel
   include: True
   kwargs:
     selector_key: "aperture_id"
     wheel:
       - selector_value: 0
         effect_class: Dichroic
         effect_kwargs:
           filename: "dichroics/TER_ubvis_dichroic.dat"
           arm_key: "aperture_id"
           arm_actions:
             0: "reflection"  # ub arm
             1: "transmission"   # vis arm

       - selector_value: 3
         effect_class: Dichroic
         effect_kwargs:
           filename: "dichroics/TER_nir_dichroic.dat"
           arm_key: "aperture_id"
           arm_actions:
             3: "reflection"  # yj arm
             5: "transmission"   # hk arm


 - name: third_dichroic_set_selector
   description: SelectorWheel holding three Dichroics, one for vis arm that splits into gr and iz, one for yj arm that splits into y and j, one for hk arm that splits into h and k
   class: SelectorWheel
   include: True
   kwargs:
     selector_key: "aperture_id"
     wheel:
       - selector_value: 1
         effect_class: Dichroic
         effect_kwargs:
           filename: "dichroics/TER_vis_dichroic.dat"
           arm_key: "aperture_id"
           arm_actions:
             1: "reflection"  # gr arm
             2: "transmission"   # iz arm

       - selector_value: 3
         effect_class: Dichroic
         effect_kwargs:
           filename: "dichroics/TER_yj_dichroic.dat"
           arm_key: "aperture_id"
           arm_actions:
             3: "reflection"  # y arm
             4: "transmission"   # j arm

       - selector_value: 5
         effect_class: Dichroic
         effect_kwargs:
           filename: "dichroics/TER_hk_dichroic.dat"
           arm_key: "aperture_id"
           arm_actions:
             5: "reflection"  # h arm
             6: "transmission"   # k arm


 - name: trace_eff  # Need only one entry for trace efficiency, and trace list as the same FITS description contains info for all arms and orders
   description: list of spectral order trace efficiencies
   class: SpectralEfficiency
   include: True
   kwargs:
     filename: "traces/TRACE_eff.fits"

 - name: trace_list
   description: list of spectral order trace geometry on the focal plane
   class: SpectralTraceList
   include: True
   kwargs:
     filename: "traces/TRACE_ZSHOOTER.fits"
     wave_colname: "wavelength"
     s_colname: "s"
     col_number_start: 1


