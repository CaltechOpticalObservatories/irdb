 - name: trace_eff_analytical
   description: list of spectral order trace efficiencies calculated from analytical model for Echelle
   class: EchelleSpectralEfficiency
   include: True
   kwargs:
     filename: "traces/echelle_trace_parameters.dat"

 - name: detector_qe_selector
   description: Throughput-only QE curves for different detectors
   class: SelectorWheel
   include: True
   kwargs:
     z_order: [610]
     selector_key: "aperture_id"
     wheel:
       - selector_value: [0] # CCD_B, e2v UV coating, UV enhanced
         effect_class: SpectralQuantumEfficiency
         effect_kwargs:
           filename: "detector_specs/ccd_uv_enhanced_TER.dat"
       - selector_value: [1] # CCD_G, placeholder inherited from old CCD_B curve
         effect_class: SpectralQuantumEfficiency
         effect_kwargs:
           filename: "detector_specs/ccd_ml_uv_enhanced_TER.dat"
       - selector_value: [2] # CCD_R, e2v ML coating, UV enhanced
         effect_class: SpectralQuantumEfficiency
         effect_kwargs:
           filename: "detector_specs/ccd_ml2_uv_enhanced_hirho_TER.dat"
       - selector_value: [3, 4, 5] # APD_H, APD_K
         effect_class: SpectralQuantumEfficiency
         effect_kwargs:
           filename: "detector_specs/APD_TER.dat"

 - name: trace_list_analytical
   description: list of spectral order trace geometry on the focal plane calculated from analytical model for Echelle
   class: EchelleSpectralTraceList
   include: True
   kwargs:
     filename: "traces/echelle_trace_parameters.dat"
     wave_colname: "wavelength"
     s_colname: "s"
     col_number_start: 1

 - name: post_echelle_diffuse_background_selector
   description: Post-echelle camera emission injected as diffuse image-plane background
   class: SelectorWheel
   include: "!INST.include_diffuse_emmisivity"
   kwargs:
     z_order: [760]
     selector_key: "image_plane_id"
     wheel:
       - selector_value: [0] # CCD_B, e2v UV coating, UV enhanced
         effect_class: PostDisperserDiffuseBackground
         effect_kwargs:
           filename: "optics/LIST_zspec_vis_optics.dat"
           detector_qe_filename: "detector_specs/ccd_uv_enhanced_TER.dat"
           wave_bin: 0.001
       - selector_value: [1] # CCD_G, placeholder inherited from old CCD_B curve
         effect_class: PostDisperserDiffuseBackground
         effect_kwargs:
           filename: "optics/LIST_zspec_vis_optics.dat"
           detector_qe_filename: "detector_specs/ccd_ml_uv_enhanced_TER.dat"
           wave_bin: 0.001
       - selector_value: [2] # CCD_R, e2v ML coating, UV enhanced
         effect_class: PostDisperserDiffuseBackground
         effect_kwargs:
           filename: "optics/LIST_zspec_vis_optics.dat"
           detector_qe_filename: "detector_specs/ccd_ml2_uv_enhanced_hirho_TER.dat"
           wave_bin: 0.001
       - selector_value: [3, 4, 5] # APD_H, APD_K
         effect_class: PostDisperserDiffuseBackground
         effect_kwargs:
           filename: "optics/LIST_zspec_nir_optics.dat"
           detector_qe_filename: "detector_specs/APD_TER.dat"
           wave_bin: 0.001
