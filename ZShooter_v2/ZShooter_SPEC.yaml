
object: instrument
alias: INST
name: ZShooter
description: Effects from the ZShooter optics

properties:
  decouple_detector_from_sky_headers: True  # needed for slit spectroscopy
  include_diffuse_emmisivity: True
  vis_curr_slit: 0.70
  nir_curr_slit: 0.70

# There are 6 image planes in ZSpec: b, g, r, yj, h, k. We use the DichroicTree effect to establish the branching
# in the beginning of the flow, using aperture_id as the identifying key. Though physically there may be other
# optical elements in between dichroics, here all dichroics are considered together in a tree. Other effects that
# act selectively on different arms can be orchestrated using SelectorWheel effects.

effects:
 - name: dichroic_tree
   description: ZShooter_v2 dichroic tree
   class: DichroicTree
   include: True
   kwargs:
     tree_filename: "dichroics/dichroic_tree.dat"
     dichroic_names:
       - bgr-yjhk # First dichroic, splits beam into bgr and yjhk
       - b-gr     # Next dichroic in bgr arm, splits b from gr
       - yj-hk    # Next dichroic in yjhk arm, splits yj from hk
       - g-r      # Next dichroic in gr arm, splits g from r
       - h-k      # Next dichroic in hk arm, splits h from k
     filename_format: "dichroics/TER_dichroic_{}.dat"


 - name: slitwheel_selector
   description: SelectorWheel holding two SlitWheels, one for bgr, one for yjhk
   class: SelectorWheel
   include: True
   kwargs:
     selector_key: "aperture_id"
     wheel:
       - selector_value: [0, 1, 2]
         effect_class: SlitWheel
         effect_kwargs:
           slit_names:
             - 1.25
             - 0.70
             - 0.57
             - 0.50
             - 0.42
             - 0.37
             - 0.33
           filename_format: "slits/slit_{:.2f}_as.dat"
           current_slit: "!INST.vis_curr_slit"  # as live property to allow dynamic updates
       - selector_value: [3, 4, 5]
         effect_class: SlitWheel
         effect_kwargs:
           slit_names:
             - 1.25
             - 0.70
             - 0.57
             - 0.50
             - 0.42
             - 0.37
             - 0.33
           filename_format: "slits/slit_{:.2f}_as.dat"
           current_slit: "!INST.nir_curr_slit"  # as live property to allow dynamic updates


 - name: channel_optics_selector
   description: ZSpec channel optics
   class: SelectorWheel
   include: True
   kwargs:
     z_order: [610]
     selector_key: "aperture_id"
     wheel:
       - selector_value: [0, 1, 2]
         effect_class: SurfaceList
         effect_kwargs:
           filename: "optics/LIST_zspec_vis_optics.dat"

       - selector_value: [3, 4, 5]
         effect_class: SurfaceList
         effect_kwargs:
           filename: "optics/LIST_zspec_nir_optics.dat"

