object: instrument
alias: INST
name: ZIMAGE
description: Effects from the ZIMAGE optics

properties:
  imager_filter_v: g

# There are 3 image planes in ZIMAGE: 3 filters. We use the DichroicTree effect to establish the branching
# in the beginning of the flow, using image_plane_id as the identifying key. Though physically there may be other
# optical elements in between dichroics, here all dichroics are considered together in a tree. Other effects that
# act selectively on different arms can be orchestrated using SelectorWheel effects.

effects:
 - name: preoptics
   class: SurfaceList
   include: True
   kwargs:
     filename: "optics/LIST_zimage_common_optics.dat"

 - name: dichroic_tree
   class: DichroicTree
   include: True
   kwargs:
     z_order: [117, 217, 517]
     tree_filename: "dichroics/zimage_dichroic_tree.dat"
     dichroic_names:
       - u-vz     # First dichroic, splits beam into u and red
       - v-z     # Next dichroic, splits z band light
     filename_format: "dichroics/TER_dichroic_{}.dat"

 - name: channel_optics_selector
   description: ZIMAGE channel optics
   class: SelectorWheel
   include: True
   kwargs:
     z_order: [220, 520]
     selector_key: "image_plane_id"
     wheel:
       - selector_value: [0]
         effect_class: SurfaceList
         effect_kwargs:
           filename: "optics/LIST_zimage_u_optics.dat"

       - selector_value: [1]
         effect_class: SurfaceList
         effect_kwargs:
           filename: "optics/LIST_zimage_v_optics.dat"

       - selector_value: [2]
         effect_class: SurfaceList
         effect_kwargs:
           filename: "optics/LIST_zimage_z_optics.dat"

 - name: filter_wheel_selector
   description: ZIMAGE v-channel filter wheel
   class: SelectorWheel
   include: True
   kwargs:
     z_order: [224, 524]
     selector_key: "image_plane_id"
     allowed_missing_selector_values: [0, 2]
     wheel:
       - selector_value: [1]
         effect_class: FilterWheel
         effect_kwargs:
           filter_names: [g, r, i]
           filename_format: "filters/sloan_{}.dat"
           current_filter: "!INST.imager_filter_v"

 - name: detector_qe_selector
   description: ZIMAGE detector quantum efficiency
   class: SelectorWheel
   include: True
   kwargs:
     z_order: [513]
     selector_key: "image_plane_id"
     wheel:
       - selector_value: [0, 1, 2]
         effect_class: QuantumEfficiencyCurve
         effect_kwargs:
           filename: "detector_specs/quest2_TER.dat"
